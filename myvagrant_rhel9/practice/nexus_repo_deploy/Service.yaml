apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: nexus
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path:   /
      prometheus.io/port:   '8081'
spec:
  selector:
    app: nexus-server
  type: LoadBalancer
  ports:
    - port: 8081
      name: abcd
      targetPort: 8081
    - port: 5000
      name: docker-private
      targetPort: 5000
